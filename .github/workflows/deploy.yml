# Build the Vite app and publish it to GitHub Pages on every push to main.
#
# The first run turns Pages on by itself (configure-pages: enablement), so no
# repository settings need touching by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The site is data-driven and every route is an anchor, so both of these
      # are real gates, not decoration.
      - name: Type-check
        run: npm run lint

      - name: Audit links and anchors
        run: node scripts/audit-links.mjs

      # Tailwind drops a utility that names a token which does not exist, so a
      # typo renders as no colour at all — white text on a white button.
      - name: Audit colour tokens
        run: node scripts/audit-tokens.mjs

      - run: npm run build

      # enablement turns Pages on for the repository on the first run, so there
      # is nothing to click in Settings after pushing.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
