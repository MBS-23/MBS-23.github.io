<!doctype html>
<!--
  Source for public/og-image.png — the card that appears when the site is
  shared on LinkedIn, WhatsApp, Slack or X. Render it with:

    chrome --headless --disable-gpu --window-size=1200,630 \
      --screenshot=public/og-image.png scripts/og-card.html

  Same tokens as the site, so the preview and the page look like one thing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #050608;
        color: #fff;
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        position: relative;
        overflow: hidden;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(90% 80% at 15% 30%, #000 10%, transparent 72%);
      }
      .glow {
        position: absolute; right: -180px; top: -140px;
        width: 620px; height: 620px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,59,74,0.13), transparent 62%);
      }
      .row { position: relative; display: flex; align-items: center; justify-content: space-between; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
      .mark { font-size: 15px; letter-spacing: 0.26em; }
      .mark span { display: block; font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.38); margin-top: 4px; }
      .coords { font-size: 12px; letter-spacing: 0.2em; color: rgba(255,255,255,0.38); }
      .surname { font-size: 14px; letter-spacing: 0.42em; color: rgba(255,255,255,0.38); }
      h1 {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 92px; line-height: 0.98; font-weight: 400;
        letter-spacing: -0.015em; margin-top: 10px;
      }
      .rule { width: 84px; height: 2px; background: #ff3b4a; margin: 30px 0 26px; }
      .disciplines { display: flex; gap: 18px; font-size: 15px; letter-spacing: 0.16em; }
      .dot { color: rgba(255,255,255,0.28); }
      .foot { font-size: 13px; letter-spacing: 0.18em; color: rgba(255,255,255,0.5); }
      .status { display: flex; align-items: center; gap: 10px; }
      .pulse { width: 8px; height: 8px; border-radius: 50%; background: #55e6a5; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="row">
      <div class="mono mark">BVVS<span>PODUGU</span></div>
      <div class="mono coords">TANUKU, ANDHRA PRADESH · INDIA — OPEN TO RELOCATE</div>
    </div>

    <div style="position: relative">
      <div class="mono surname">PODUGU</div>
      <h1>Bala Veera<br />Venkata Sunil</h1>
      <div class="rule"></div>
      <div class="mono disciplines">
        <span style="color: #ff3b4a">CYBERSECURITY</span>
        <span class="dot">×</span>
        <span style="color: #5de7f5">AI / ML</span>
        <span class="dot">×</span>
        <span style="color: #55e6a5">FULL-STACK</span>
      </div>
    </div>

    <div class="row">
      <div class="mono foot status"><span class="pulse"></span>B.TECH AI &amp; ML 2026 · 7 INTERNSHIPS · PUBLISHED PAPER</div>
      <div class="mono foot">AVAILABLE FOR OPPORTUNITIES</div>
    </div>
  </body>
</html>
